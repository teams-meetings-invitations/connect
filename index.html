        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', sans-serif;
            }

            body {
                background: #f3f3f3;
            }

            /* HEADER */
            .header {
                height: 70px;
                background: #ffffff;
                display: flex;
                align-items: center;
                padding: 0 40px;
                border-bottom: 1px solid #ddd;
            }

            .logo-box {
                width: 40px;
                height: 40px;
                background: #5b5fc7;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 22px;
            }

            /* MAIN LAYOUT */
            .main {
                display: flex;
                height: calc(100vh - 70px);
                padding: 20px;
                gap: 20px;
            }

            /* LEFT SIDE */
            .left {
                flex: 2;
                background: #1f2333;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .participants {
                display: flex;
                gap: 70px;
                flex-wrap: wrap;
                justify-content: center;
            }

            /* Avatar wrapper */
            .avatar-wrapper {
                position: relative;
                width: 160px;
                height: 160px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Pulse Rings */
            .avatar-wrapper::before,
            .avatar-wrapper::after {
                content: "";
                position: absolute;
                width: 200px;
                height: 200px;
                border-radius: 50%;
                border: 5px solid rgba(0, 123, 255, 0.35);
                animation: pulse 2.5s infinite;
            }

            .avatar-wrapper::after {
                animation-delay: 1.2s;
            }

            /* Avatar */
            .avatar {
                width: 140px;
                height: 140px;
                border-radius: 50%;
                overflow: hidden;
                z-index: 2;
            }

            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Online Dot */
            .status {
                position: absolute;
                bottom: 15px;
                left: 20px;
                width: 14px;
                height: 14px;
                background: #00ff00;
                border-radius: 50%;
                border: 3px solid #1f2333;
                z-index: 3;
            }

            /* RIGHT SIDE */
            .right {
                flex: 1;
                background: #eaeaea;
                border-radius: 12px;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            /* Fading Blue Glow */
            .right::before {
                content: "";
                position: absolute;
                width: 300px;
                height: 300px;
                background: radial-gradient(circle, rgba(25, 118, 210, 0.35) 0%, rgba(25, 118, 210, 0.15) 40%, rgba(25, 118, 210, 0.05) 65%, transparent 80%);
                border-radius: 50%;
                animation: fadeGlow 3s infinite ease-in-out;
            }

            /* Glow Animation */
            @keyframes fadeGlow {
                0% {
                    opacity: 0.6;
                    transform: scale(0.95);
                }

                50% {
                    opacity: 1;
                    transform: scale(1.05);
                }

                100% {
                    opacity: 0.6;
                    transform: scale(0.95);
                }
            }

            /* RIGHT CIRCLE WRAPPER */
            .right-circle-wrapper {
                position: relative;
                width: 150px;
                height: 150px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Pulse Rings for Right Circle */
            .right-circle-wrapper::before,
            .right-circle-wrapper::after {
                content: "";
                position: absolute;
                width: 190px;
                height: 190px;
                border-radius: 50%;
                border: 5px solid rgba(0, 123, 255, 0.35);
                animation: pulse 2.5s infinite;
            }

            .right-circle-wrapper::after {
                animation-delay: 1.2s;
            }

            /* Center Circle */
            .center-circle {
                width: 120px;
                height: 120px;
                background: rgba(0, 123, 255, 0.25);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2;
            }

            .center-circle::before {
                content: "";
                width: 70px;
                height: 70px;
                background: #1976d2;
                border-radius: 50%;
            }

            /* Pulse Animation */
            @keyframes pulse {
                0% {
                    transform: scale(0.9);
                    opacity: 0.6;
                }

                70% {
                    transform: scale(1.2);
                    opacity: 0.2;
                }

                100% {
                    transform: scale(1.3);
                    opacity: 0;
                }
            }

            /* Join Button */
            .join-btn {
                position: absolute;
                bottom: 25px;
                right: 25px;
                background: #2563eb;
                color: white;
                padding: 12px 22px;
                border-radius: 6px;
                border: none;
                font-size: 14px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.3s;
            }

            .join-btn:hover {
                background: #1e4ed8;
            }

            /* RESPONSIVE */
            @media(max-width:1024px) {
                .main {
                    flex-direction: column;
                }

                .right {
                    height: 300px;
                }

                .join-btn {
                    right: 50%;
                    transform: translateX(50%);
                }
            }

            @media(max-width:480px) {
                .avatar-wrapper {
                    width: 120px;
                    height: 120px;
                }

                .avatar {
                    width: 100px;
                    height: 100px;
                }

                .participants {
                    gap: 40px;
                }
            }
            #early {
  position: fixed;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f3f3f3;
  z-index: 9999;
}
